<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Salamandras Store | Minha loja</title>
<style>body{font-family:system-ui,sans-serif;margin:0;background:#f4f7f7;color:#1e3838;display:grid;place-items:center;min-height:100vh}main{padding:2.5rem;background:#fff;max-width:520px;border:1px solid #e0e9e6;border-radius:22px;text-align:center;box-shadow:0 16px 60px #172e3010}h1{color:#176f60}a{color:#176f60}</style></head><body>
<main><h1>Salamandras Store</h1><p id="status">Abrindo a loja da empresa...</p><p><a id="loja-alternativa" href="loja-doceria.html" hidden>Usar o modelo de alimentação</a></p></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script>
<script>
(async()=>{const slug=new URLSearchParams(location.search).get('loja')||'doceria-teste';
try{const cfg=window.SALAMANDRAS_CONFIG;if(!cfg||!cfg.url||!cfg.key)throw Error('Configuração pública ausente');
const client=window.supabase.createClient(cfg.url,cfg.key,{auth:{persistSession:false,autoRefreshToken:false}});
const {data,error}=await client.rpc('api_12_modelo_publico',{p_slug:slug});if(error)throw error;
if(!data){document.getElementById('status').textContent='Loja não encontrada ou temporariamente indisponível.';return;}
location.replace((data==='comercio'?'loja-geral.html':'loja-doceria.html')+'?loja='+encodeURIComponent(slug));
}catch(err){document.getElementById('status').textContent='Não foi possível abrir a loja. Verifique a publicação ou contate a empresa.';console.warn(err);}}
)();
</script></body></html>
